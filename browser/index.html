<!doctype html>
<!--
  Design preview of the Forever Exercise popup, without WoW.
  Serve the repo root (fetch needs http):  python -m http.server 8000 --bind 127.0.0.1
  then open http://localhost:8000/browser/
  It reads ../ForeverExercise/Exercises.lua and reloads when that file changes.
  Layout numbers mirror Build() in ForeverExercise.lua: keep them in sync.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forever Exercise – preview</title>
<style>
  :root { --gold: #ffd100; }
  body { margin: 0; display: flex; min-height: 100vh; background: #0d0b09; color: #ddd;
         font: 13px/1.35 "Friz Quadrata TT", "Friz Quadrata", Georgia, serif; }
  #error { position: fixed; inset: 0 0 auto 0; padding: 8px 12px; background: #8b0000; color: #fff;
           font: 13px system-ui, sans-serif; z-index: 9; }
  #stage { flex: 1; display: grid; place-items: center;
           background: radial-gradient(circle at 30% 20%, #3b4a3a, #121611 70%); }

  .frame { position: relative; width: 470px; height: 380px; background: #15110d;
           border: 2px solid #4a3c2a; border-radius: 6px 6px 4px 4px;
           box-shadow: inset 0 0 0 1px #8a6d3b, 0 0 0 1px #000, 0 8px 30px #000a; }
  .titlebar { position: absolute; inset: 0 0 auto 0; height: 22px; line-height: 22px; text-align: center;
              background: linear-gradient(#3a2f24, #1d1813); border-bottom: 1px solid #000;
              border-radius: 5px 5px 0 0; color: var(--gold); text-shadow: 1px 1px 0 #000; }
  .close { position: absolute; right: 3px; top: 2px; width: 18px; height: 18px; padding: 0; border-radius: 50%;
           border: 1px solid #000; background: radial-gradient(#c22, #600); color: #fdd; font: bold 11px sans-serif;
           cursor: pointer; }
  .portrait { position: absolute; left: -8px; top: -8px; width: 60px; height: 60px; border-radius: 50%; z-index: 2;
              border: 3px solid #c8a250; box-shadow: 0 0 0 2px #2a1e10, 0 2px 6px #000;
              background: #000; }
  #name { position: absolute; left: 66px; top: 29px; color: var(--gold); font-size: 16px; line-height: 1;
          text-shadow: 1px 1px 0 #000; }
  #flavor { position: absolute; left: 66px; top: 48px; color: #808080; font-size: 10px; line-height: 1; }
  .inset { position: absolute; left: 4px; top: 60px; right: 6px; bottom: 26px; background: #0b0907;
           border: 1px solid #2e261c; box-shadow: inset 0 0 8px #000; }

  .figure { position: absolute; border-radius: 5px;
            background: radial-gradient(ellipse at 50% 40%, #f5e7c3, #e3cc98 65%, #c8aa6e);
            box-shadow: inset 0 0 0 2px #c9a65a, inset 0 0 0 3px #6b5328; }
  .figure canvas { display: block; }
  #big { left: 8px; top: 8px; }
  .thumb { top: 196px; transition: opacity .2s; }
  .thumb span { position: absolute; left: 6px; top: 4px; font-size: 10px; color: #3d210d; }
  #steps { position: absolute; left: 200px; top: 12px; right: 10px; color: #fff; font-size: 12px; }
  #steps p { margin: 0 0 14px; }
  #steps b { color: var(--gold); font-weight: normal; }

  .bar { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 16px; background: #0009; }
  .bar div { height: 100%; width: 0; background: linear-gradient(#ffe066, #d9a400); }
  .bar span { position: absolute; inset: 0; text-align: center; line-height: 16px; font-size: 10px;
              color: #fff; text-shadow: 1px 1px 0 #000; }

  .btn { position: absolute; bottom: 4px; width: 108px; height: 22px; padding: 0; cursor: pointer;
         background: linear-gradient(#b3170f, #6d0904); border: 1px solid #1a0000; border-radius: 3px;
         box-shadow: inset 0 1px 0 #ff6a4a55; color: var(--gold); font-family: inherit; font-size: 12px; text-shadow: 1px 1px 0 #000; }
  .btn:hover { filter: brightness(1.2); }
  .btn:disabled { filter: grayscale(1) brightness(.6); cursor: default; }

  aside { width: 280px; padding: 16px; background: #1e1e1e; font: 13px system-ui, sans-serif; }
  aside h2 { margin: 0 0 12px; font-size: 15px; }
  aside label { display: block; margin: 8px 0; }
  aside label.sub { margin: 2px 0 8px 18px; }
  aside select, aside input[type=number] { width: 100%; box-sizing: border-box; margin-top: 4px; }
  aside button { margin: 4px 4px 4px 0; }
  #readout { margin-top: 16px; padding: 8px; background: #111; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div id="error" hidden></div>

<section id="stage">
  <div id="popup" class="frame" hidden>
    <div class="portrait"></div>
    <div class="titlebar">Forever Exercise</div>
    <button class="close" id="close" title="Close">×</button>
    <div id="name"></div>
    <div id="flavor"></div>
    <div class="inset">
      <div class="figure" id="big"><canvas></canvas></div>
      <div id="steps"></div>
      <div id="thumbs"></div>
      <div class="bar"><div id="fill"></div><span id="bartext"></span></div>
    </div>
    <button class="btn" id="start" style="left:6px">Start</button>
    <button class="btn" id="another" style="left:118px">Another</button>
    <button class="btn" id="snooze" style="left:230px">Snooze</button>
    <button class="btn" id="skip" style="left:342px">Skip</button>
  </div>
</section>

<aside>
  <h2>Dev panel</h2>
  <label>Language
    <select id="lang">
      <option value="enUS">English</option>
      <option value="deDE">Deutsch</option>
      <option value="frFR">Français</option>
      <option value="esES">Español (España)</option>
      <option value="esMX">Español (Latinoamérica)</option>
      <option value="itIT">Italiano</option>
      <option value="ptBR">Português (Brasil)</option>
      <option value="ruRU">Русский</option>
      <option value="koKR">한국어</option>
      <option value="zhCN">简体中文</option>
      <option value="zhTW">繁體中文</option>
    </select>
  </label>
  <label>Exercise <select id="picker"></select></label>
  <button id="show">Show reminder</button>
  <button id="finish">Finish countdown</button>
  <label>Interval (minutes) <input id="interval" type="number" min="5" max="120" step="5"></label>
  <label>Clock
    <select id="speed"><option value="60">fast: 1 minute = 1 second</option><option value="1">real time</option></select>
  </label>
  <label><input id="pauseRaid" type="checkbox"> Pause in raids</label>
  <label><input id="pauseDungeon" type="checkbox"> Pause in dungeons</label>
  <label>Where
    <select id="where">
      <option value="world">world</option>
      <option value="party">dungeon</option>
      <option value="raid">raid</option>
    </select>
  </label>
  <label><input id="combat" type="checkbox"> Simulate: in combat</label>
  <label><input id="dieWorld" type="checkbox"> Exercise when you die</label>
  <label class="sub"><input id="dieWorldGhost" type="checkbox"> Only while you are a ghost</label>
  <label><input id="dieDungeon" type="checkbox"> Exercise when you die in a dungeon</label>
  <label class="sub"><input id="dieDungeonGhost" type="checkbox"> Only while you are a ghost</label>
  <label><input id="dieRaid" type="checkbox"> Exercise when you die in a raid</label>
  <label class="sub"><input id="dieRaidGhost" type="checkbox"> Only while you are a ghost</label>
  <button id="die">Die</button>
  <button id="release">Release spirit</button>
  <div id="readout"></div>
</aside>

<script src="luadata.js"></script>
<script>
const LUA = '../ForeverExercise/Exercises.lua';
const $ = (id) => document.getElementById(id);
let D, S, ex, src = '', t = 0;
let locale = null;
// Mirrors the locals of ForeverExercise.lua
const sim = { elapsed: 0, snoozed: false, combatHide: false, remaining: null, done: false };
let waitingGhost = false;

const rgba = (c) => `rgba(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0},${c[3] ?? 1})`;
const shown = () => !$('popup').hidden;
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

function sizeCanvas(canvas, css) {
  canvas.width = canvas.height = Math.round(css * devicePixelRatio);
  canvas.style.width = canvas.style.height = css + 'px';
  canvas.parentElement.style.width = canvas.parentElement.style.height = css + 'px';
}

// Same drawing as CreateFigure/Place: props, far limbs, near limbs, head
function drawFigure(canvas, pose) {
  const ctx = canvas.getContext('2d'), size = canvas.width, u = size / 100;
  const pt = (p) => [p[0] * u, size - p[1] * u];
  const line = (a, b, color, width) => {
    ctx.strokeStyle = rgba(color);
    ctx.lineWidth = width * u;
    ctx.beginPath(); ctx.moveTo(...pt(a)); ctx.lineTo(...pt(b)); ctx.stroke();
  };
  ctx.clearRect(0, 0, size, size);
  ctx.lineCap = 'round';
  for (const name of ex.props) for (const s of D.props[name]) line([s[0], s[1]], [s[2], s[3]], S.prop, S.propThickness);
  const far = (j) => j[0] === 'l';
  const ink = (j) => (ex.side && far(j) ? S.far : S.ink);
  for (const pass of [true, false]) {
    for (const [a, b] of D.bones) if (far(b) === pass) line(pose[a], pose[b], ink(b), S.thickness);
  }
  ctx.fillStyle = rgba(S.ink);
  ctx.beginPath(); ctx.arc(...pt(pose.head), S.headRadius * u, 0, Math.PI * 2); ctx.fill();
}

function setBar(value, text) {
  $('fill').style.width = (value / D.timing.duration * 100) + '%';
  $('bartext').textContent = text;
}

function say(key, fallback, ...args) {
  return fill((locale && locale[key]) || fallback, ...args);
}

function spoken(exercise) {
  const pack = locale && locale.exercises && locale.exercises[exercise.id];
  return pack ? { ...exercise, name: pack.name, flavor: pack.flavor, steps: pack.steps } : exercise;
}

function fitFrame() {
  const frame = document.querySelector('.frame');
  frame.style.width = '';
  frame.style.height = '';
  let x = 6;
  for (const id of ['start', 'another', 'snooze', 'skip']) {
    const button = $(id);
    button.style.width = 'max-content';
    const width = Math.max(108, button.offsetWidth + 12);
    button.style.width = width + 'px';
    button.style.left = x + 'px';
    x += width + 4;
  }
  frame.style.width = Math.max(470, x + 8) + 'px';
  const bar = document.querySelector('.bar');
  const steps = $('steps');
  const overlap = steps.offsetTop + steps.scrollHeight - (bar.offsetTop - 8);
  if (overlap > 0) frame.style.height = (frame.offsetHeight + overlap) + 'px';
}

function setIdle() {
  sim.remaining = null;
  sim.done = false;
  setBar(0, say('ready', 'Ready? %d seconds', D.timing.duration));
  $('start').textContent = say('start', 'Start');
  $('start').disabled = false;
}

function render() {
  const text = spoken(ex);
  document.querySelector('.titlebar').textContent = say('title', 'Forever Exercise');
  $('another').textContent = say('another', 'Another');
  $('skip').textContent = say('skip', 'Skip');
  $('snooze').textContent = say('snooze', 'Snooze %d min', D.timing.snooze);
  $('name').textContent = text.name;
  $('flavor').textContent = text.flavor;
  $('steps').innerHTML = text.steps.map((s, i) => `<p><b>${i + 1}.</b> ${esc(s)}</p>`).join('');
  sizeCanvas($('big').firstElementChild, 180);
  $('thumbs').replaceChildren(...ex.frames.map((pose, i) => {
    const el = document.createElement('div');
    el.className = 'figure thumb';
    el.style.left = (8 + i * 68) + 'px';
    el.innerHTML = `<canvas></canvas><span>${i + 1}</span>`;
    sizeCanvas(el.firstChild, 60);
    drawFigure(el.firstChild, pose);
    return el;
  }));
  $('picker').value = ex.id;
  t = 0;
  setIdle();
  fitFrame();
}

const deck = [];

function pick() {
  ex = nextFromDeck(deck, D.exercises, ex);
}

function show() { sim.snoozed = false; pick(); render(); $('popup').hidden = false; }

function hide() {
  if (!sim.combatHide) {
    sim.elapsed = 0;
    sim.snoozed = false;
  }
  sim.combatHide = false;
  sim.remaining = null;
  $('popup').hidden = true;
}

function tick() {
  const interval = $('interval').value * 60;
  const where = $('where').value;
  const paused = (where === 'raid' && $('pauseRaid').checked) || (where === 'party' && $('pauseDungeon').checked);
  if (!shown() && !paused) {
    sim.elapsed += Number($('speed').value);
    if (sim.elapsed >= interval && !$('combat').checked) show();
  }
  const left = Math.max(0, interval - sim.elapsed);
  $('readout').textContent = statusLines({
    shown: shown(),
    remaining: sim.remaining,
    finished: sim.done,
    paused: paused ? (where === 'raid' ? say('inRaid', 'in a raid') : say('inDungeon', 'in a dungeon')) : null,
    snoozed: sim.snoozed,
    due: !shown() && sim.elapsed >= interval && $('combat').checked,
    left,
    waitForGhost: waitingGhost && !shown(),
  }, locale).join(' · ');
}

let last = performance.now();
function animate(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (shown() && ex) {
    t += dt;
    const n = ex.frames.length, step = t / ex.tempo, i = Math.floor(step) % n;
    let a = Math.min(1, Math.max(0, (step % 1 - S.hold) / (1 - S.hold)));
    a = a * a * (3 - 2 * a);
    const A = ex.frames[i], B = ex.frames[(i + 1) % n];
    const pose = {};
    for (const j in A) pose[j] = [A[j][0] + (B[j][0] - A[j][0]) * a, A[j][1] + (B[j][1] - A[j][1]) * a];
    drawFigure($('big').firstElementChild, pose);
    [...$('thumbs').children].forEach((el, k) => { el.style.opacity = k === i ? 1 : 0.55; });

    if (sim.remaining !== null) {
      sim.remaining -= dt;
      if (sim.remaining > 0) {
        setBar(D.timing.duration - sim.remaining, say('secondsLeft', '%ds', Math.ceil(sim.remaining)));
      } else {
        sim.remaining = null;
        sim.elapsed = 0;
        sim.done = true;
        setBar(D.timing.duration, say('wellDone', 'Well done, champion!'));
        $('start').textContent = say('done', 'Done');
        $('start').disabled = false;
      }
    }
  }
  requestAnimationFrame(animate);
}

async function reload() {
  try {
    const res = await fetch(LUA, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${LUA}: HTTP ${res.status}`);
    const text = await res.text();
    if (text === src) return;
    const data = loadData(text);
    const first = !D;
    src = text; D = data; S = data.style;
    deck.length = 0; // the reloaded exercises are new objects; the old deck would play stale ones
    $('error').hidden = true;
    $('picker').replaceChildren(...D.exercises.map((e) => new Option(e.name, e.id)));
    if (first) {
      $('interval').value = D.defaults.interval;
      $('pauseRaid').checked = D.defaults.pauseInRaid;
      $('pauseDungeon').checked = D.defaults.pauseInDungeon;
      $('dieWorld').checked = D.defaults.exerciseOnDeath;
      $('dieWorldGhost').checked = D.defaults.exerciseOnDeathGhost;
      $('dieDungeon').checked = D.defaults.exerciseOnDungeonDeath;
      $('dieDungeonGhost').checked = D.defaults.exerciseOnDungeonDeathGhost;
      $('dieRaid').checked = D.defaults.exerciseOnRaidDeath;
      $('dieRaidGhost').checked = D.defaults.exerciseOnRaidDeathGhost;
      lockGhostOptions();
      show();
    } else {
      ex = D.exercises.find((e) => e.id === ex?.id) ?? D.exercises[0];
      render();
    }
  } catch (e) {
    $('error').textContent = e.message;
    $('error').hidden = false;
  }
}

$('start').onclick = () => {
  if (sim.done) return hide();
  sim.remaining = D.timing.duration;
  $('start').disabled = true;
};
$('another').onclick = () => { pick(); render(); };
$('snooze').onclick = () => {
  hide();
  sim.elapsed = $('interval').value * 60 - D.timing.snooze * 60;
  sim.snoozed = true;
};
$('skip').onclick = $('close').onclick = hide;
document.onkeydown = (e) => { if (e.key === 'Escape' && shown()) hide(); };
$('show').onclick = () => { if (!$('combat').checked) show(); };
$('finish').onclick = () => { if (sim.remaining !== null) sim.remaining = 0.01; };
$('picker').onchange = () => {
  ex = D.exercises.find((e) => e.id === $('picker').value);
  render();
  $('popup').hidden = false;
};
$('combat').onchange = () => {
  if ($('combat').checked && shown()) {
    sim.combatHide = true;
    // An unfinished popup is due again when combat ends. A finished one stays closed.
    if (!sim.done) sim.elapsed = Math.max(sim.elapsed, $('interval').value * 60);
    hide();
  }
};

function lockGhostOptions() {
  for (const [parent, child] of [['dieWorld', 'dieWorldGhost'], ['dieDungeon', 'dieDungeonGhost'], ['dieRaid', 'dieRaidGhost']]) {
    $(child).disabled = !$(parent).checked;
  }
}
for (const id of ['dieWorld', 'dieDungeon', 'dieRaid']) $(id).onchange = lockGhostOptions;

function deathChoice() {
  const where = $('where').value;
  if (where === 'raid') return [$('dieRaid').checked, $('dieRaidGhost').checked];
  if (where === 'party') return [$('dieDungeon').checked, $('dieDungeonGhost').checked];
  return [$('dieWorld').checked, $('dieWorldGhost').checked];
}

const LOCALE_CODES = ['enUS', 'deDE', 'frFR', 'esES', 'esMX', 'itIT', 'ptBR', 'ruRU', 'koKR', 'zhCN', 'zhTW'];
const locales = {};

async function loadLocales() {
  await Promise.all(LOCALE_CODES.map(async (code) => {
    const res = await fetch(`../ForeverExercise/Locales/${code}.lua`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${code}.lua: HTTP ${res.status}`);
    locales[code] = parseLocale(await res.text()).table;
  }));
  locale = locales[$('lang').value] || locales.enUS;
}

$('lang').onchange = () => {
  locale = locales[$('lang').value];
  if (shown()) render();
  else fitFrame();
};

$('die').onclick = () => {
  const [enabled, ghostsOnly] = deathChoice();
  const reaction = deathReaction(enabled, ghostsOnly, null);
  waitingGhost = reaction === 'wait';
  if (reaction === 'show' && !$('combat').checked) show();
};
$('release').onclick = () => {
  const [enabled, ghostsOnly] = deathChoice();
  if (waitingGhost && deathReaction(enabled, ghostsOnly, true) === 'show' && !$('combat').checked) show();
  waitingGhost = false;
};

loadLocales().then(reload).catch((e) => {
  $('error').textContent = e.message;
  $('error').hidden = false;
});
setInterval(reload, 1000);
setInterval(tick, 1000);
requestAnimationFrame(animate);
</script>
</body>
</html>
